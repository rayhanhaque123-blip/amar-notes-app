
name: Build Smart Notes Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Extract Project
        run: |
          test -f smart-notes-pro-phase1.tar.gz
          tar -xzf smart-notes-pro-phase1.tar.gz
          test -f smart-notes-pro/package.json

      - name: Install Dependencies
        working-directory: smart-notes-pro
        run: npm install

      - name: Add Android Platform
        working-directory: smart-notes-pro
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: smart-notes-pro
        run: npx cap sync android

      - name: Build APK
        working-directory: smart-notes-pro
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f smart-notes-pro/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Notes-Pro-APK
          path: smart-notes-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
