<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3157d5"><meta name="description" content="Smart Notes Pro — offline personal notes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./css/app.css">
<title>Smart Notes Pro</title>
</head>
<body>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-icon">✦</span><span>Smart Notes <b>Pro</b></span></div>
  <button class="new-note" id="newNote">＋ নতুন নোট</button>
  <div class="nav-label">লাইব্রেরি</div>
  <nav id="nav"></nav>
  <div class="nav-label folder-label">ফোল্ডার <button id="addFolder" title="নতুন ফোল্ডার">＋</button></div>
  <div id="folders"></div>
  <div class="side-bottom"><span class="local-dot"></span> শুধু এই ডিভাইসে সংরক্ষিত <button id="backupBtn">ব্যাকআপ / Restore</button></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main class="main">
  <header class="topbar">
   <button class="icon-btn menu-btn" id="menuBtn" aria-label="মেনু">☰</button>
   <div class="search-wrap"><span>⌕</span><input id="search" placeholder="নোট খুঁজুন…" type="search"></div>
   <select id="sort" aria-label="সাজান"><option value="updated">সর্বশেষ</option><option value="created">তৈরির তারিখ</option><option value="title">নাম অনুযায়ী</option></select>
   <button class="icon-btn" id="themeBtn" title="থিম বদলান">◐</button>
  </header>
  <section class="content">
   <div class="heading-row"><div><div class="eyebrow">YOUR WORKSPACE</div><h1 id="viewTitle">সব নোট</h1><p id="viewSub">আপনার সব লেখা এক জায়গায় রাখুন।</p></div><button class="new-note desktop-new" id="newNote2">＋ নতুন নোট</button></div>
   <div class="list-tools"><span id="noteCount">০টি নোট</span><div id="filterChips"></div></div>
   <section id="noteList" class="note-grid"></section>
  </section>
 </main>
</div>
<div class="modal" id="modal"><section class="editor-modal" id="editorModal"></section></div>
<div class="modal" id="backupModal"><section class="small-modal" id="backupContent"></section></div>
<div class="toast" id="toast" role="status"></div>
<script src="./js/db.js"></script><script src="./js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
