<script>

let notes = JSON.parse(localStorage.getItem("myNotes") || "[]");
let currentNote = null;
let saveTimer;

const editor = document.getElementById("editor");
const title = document.getElementById("noteTitle");

function createId() {
    return Date.now().toString();
}

function newNote() {
    saveNote();

    const note = {
        id: createId(),
        title: "Untitled Note",
        content: ""
    };

    notes.unshift(note);
    currentNote = note.id;

    renderNotes();
    openNote(note.id);
    saveAll();
}

function saveAll() {
    localStorage.setItem("myNotes", JSON.stringify(notes));
}

function saveNote() {
    if (!currentNote) return;

    const note = notes.find(n => n.id === currentNote);

    if (!note) return;

    note.title = title.value || "Untitled Note";
    note.content = editor.innerHTML;
    note.updated = new Date().toISOString();

    saveAll();
    renderNotes();

    document.getElementById("saveStatus").textContent =
        "✓ Saved";
}

function autoSave() {
    document.getElementById("saveStatus").textContent =
        "Saving...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(saveNote, 500);
}

function openNote(id) {
    saveNote();

    currentNote = id;

    const note = notes.find(n => n.id === id);

    if (!note) return;

    title.value = note.title;
    editor.innerHTML = note.content;

    renderNotes();
    updateCount();
}

function renderNotes() {
    const list = document.getElementById("noteList");

    list.innerHTML = "";

    notes.forEach(note => {
        const item = document.createElement("div");

        item.className = "note-item" +
            (note.id === currentNote ? " active" : "");

        item.textContent = "📄 " + note.title;

        item.onclick = () => openNote(note.id);

        list.appendChild(item);
    });
}

function cmd(command, value = null) {
    editor.focus();
    document.execCommand(command, false, value);
    autoSave();
}

function chooseColor() {
    document.getElementById("colorPicker").click();
}

function clearFormat() {
    cmd("removeFormat");
}

function insertLink() {
    const url = prompt("Enter URL:");

    if (url) {
        cmd("createLink", url);
    }
}

function insertTable() {
    const rows = parseInt(prompt("Number of rows:", "3"));
    const cols = parseInt(prompt("Number of columns:", "3"));

    if (!rows || !cols || rows < 1 || cols < 1 ||
        rows > 30 || cols > 20) return;

    let html = '<table border="1" cellpadding="8" ' +
        'style="border-collapse:collapse;width:100%">';

    for (let r = 0; r < rows; r++) {
        html += "<tr>";

        for (let c = 0; c < cols; c++) {
            html += "<td>&nbsp;</td>";
        }

        html += "</tr>";
    }

    html += "</table><p></p>";

    editor.focus();
    document.execCommand("insertHTML", false, html);
    autoSave();
}

function insertImage() {
    const input = document.createElement("input");

    input.type = "file";
    input.accept = "image/*";

    input.onchange = () => {
        const file = input.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = () => {
            editor.focus();

            document.execCommand(
                "insertImage",
                false,
                reader.result
            );

            autoSave();
        };

        reader.readAsDataURL(file);
    };

    input.click();
}

function downloadFile(filename, content, type) {
    const blob = new Blob([content], {type: type});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;

    a.click();

    URL.revokeObjectURL(url);
}

function downloadTXT() {
    saveNote();

    downloadFile(
        (title.value || "note") + ".txt",
        editor.innerText,
        "text/plain;charset=utf-8"
    );
}

<head>
<meta charset="UTF-8">
<title>${escapeHTML(title.value)}</title>
</head>
<body>
${editor.innerHTML}
</body>
</html>`;

    downloadFile(
        (title.value || "note") + ".html",
        html,
        "text/html;charset=utf-8"
    );
}

        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}
